# Builds the Cellar Studio Windows installer and portable exe when a version tag (v*) is pushed, and attaches them
# to a GitHub Release. The tag must match desktop/package.json "version" (e.g. tag v0.1.0 for version 0.1.0).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "tag $GITHUB_REF_NAME does not match desktop/package.json version $v"; exit 1; fi

      - name: Companion dependencies and tests
        working-directory: companion
        run: |
          npm ci
          npm test

      - name: Build Studio
        working-directory: studio
        run: |
          npm ci
          npm run build

      - name: Package desktop app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npm run dist -- --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CellarStudio-windows
          path: |
            desktop/release/CellarStudio-Setup-*.exe
            desktop/release/CellarStudio-Portable-*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            desktop/release/CellarStudio-Setup-*.exe
            desktop/release/CellarStudio-Portable-*.exe
