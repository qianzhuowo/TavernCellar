<!doctype html>
<html lang="zh-CN" data-theme="dark" data-density="comfortable">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cellar Studio</title>
  <script>
    /* Avoid a theme flash before /api/settings arrives: reuse the last known theme. */
    try { var t = localStorage.getItem('cs.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
