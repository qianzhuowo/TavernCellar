appId: io.github.qianzhuowo.taverncellar
productName: Cellar Studio
copyright: TavernCellar contributors · AGPL-3.0-only
directories:
  app: .stage
  output: release
  buildResources: assets
# .stage already holds exactly what ships (see scripts/stage.mjs); keep its node_modules as copied.
npmRebuild: false
asar: true
files:
  - "**/*"
# Writes resources/app-update.yml (where electron-updater looks for releases) and release/latest.yml; the release
# workflow attaches latest.yml and the blockmap to the GitHub Release. Nothing is uploaded by electron-builder itself
# (the workflow runs it with --publish never).
publish:
  provider: github
  owner: qianzhuowo
  repo: TavernCellar
  releaseType: release
win:
  icon: assets/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Cellar Studio
  artifactName: CellarStudio-Setup-${version}.${ext}
  # Keeps $INSTDIR\workspace (the default workspace) on uninstall and upgrade.
  include: assets/installer.nsh
portable:
  artifactName: CellarStudio-Portable-${version}.${ext}
